name: auto-revendor

# Keeps vendored plugins current with upstream automatically. Weekly (and on-demand) it
# re-vendors from pinned upstream SHAs, re-applies + verifies the Fornida overlays, and —
# when something changed AND the machine gates pass — commits straight to main and pushes.
# No PR, no human click. The machine gates (verify-overlays + plugin validate) are the only
# guard: a broken overlay or invalid marketplace aborts the push.
#
# Trade-off (accepted by the repo owner): upstream changes auto-publish to the org
# marketplace unreviewed. The gates catch overlay/validation breakage, NOT unwanted upstream
# behaviour changes. To re-introduce human review, switch the final step back to opening a PR.
#
# See docs/plans/2026-06-26-001-feat-fix-and-merge-plugin-updates-plan.md.

on:
  schedule:
    # Mondays 13:00 UTC (~7-8am US Central). Runner clock is UTC.
    - cron: '0 13 * * 1'
  workflow_dispatch: {}

# Only needs to push commits to main. No pull-requests scope.
permissions:
  contents: write

# Never let two re-vendor runs race.
concurrency:
  group: auto-revendor
  cancel-in-progress: false

jobs:
  revendor:
    runs-on: ubuntu-latest  # Linux tar handles CE's symlinked mirror dirs that Windows tar.exe cannot.
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Re-vendor + apply/verify overlays
        shell: pwsh
        # -NoCommit: vendor + apply-overlays + verify-overlays, leave changes in the working
        # tree. verify-overlays.ps1 exits non-zero on overlay drift, failing the job here so a
        # broken overlay never reaches main.
        env:
          GH_TOKEN: ${{ github.token }}  # setup-fornida-plugins.ps1 uses `gh api` to resolve SHAs/tarballs.
        run: ./setup-fornida-plugins.ps1 -NoCommit

      - name: Validate manifests
        shell: bash
        # Hard gate: malformed JSON must not reach main. The `claude` CLI is not available on
        # GitHub runners, so validate JSON well-formedness with jq (preinstalled on ubuntu)
        # across the marketplace manifest and every vendored plugin.json.
        run: |
          set -e
          jq empty .claude-plugin/marketplace.json
          while IFS= read -r f; do
            echo "validating $f"
            jq empty "$f"
          done < <(find plugins -name plugin.json -path '*/.claude-plugin/*')

      - name: Commit + push to main on change
        shell: bash
        # If nothing changed, exit clean (no commit, no push). Otherwise commit the vendored
        # trees + VENDOR.md and push straight to main.
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No upstream changes — nothing to publish."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(vendor): scheduled re-pin of plugins to latest upstream; overlays re-applied"
          git push origin HEAD:main
