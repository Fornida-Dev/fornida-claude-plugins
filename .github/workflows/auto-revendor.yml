name: auto-revendor

# Keeps vendored plugins current with upstream automatically. Weekly (and on-demand) it
# re-vendors RAW from pinned upstream SHAs (no overlays — Fornida force lives in the kit) and,
# when something changed AND the manifest gate passes, commits straight to main and pushes.
# No PR, no human click. The gate (jq well-formedness + agents-must-be-array) aborts the push
# on a malformed or schema-invalid manifest so a broken marketplace never reaches the org sync.
#
# Trade-off (accepted by the repo owner): upstream changes auto-publish to the org
# marketplace unreviewed. The gate catches manifest breakage, NOT unwanted upstream behaviour
# changes. To re-introduce human review, switch the final step back to opening a PR.
#
# See docs/plans/2026-06-26-001-feat-fix-and-merge-plugin-updates-plan.md.

on:
  schedule:
    # Mondays 13:00 UTC (~7-8am US Central). Runner clock is UTC.
    - cron: '0 13 * * 1'
  workflow_dispatch: {}

# Only needs to push commits to main. No pull-requests scope.
permissions:
  contents: write

# Never let two re-vendor runs race.
concurrency:
  group: auto-revendor
  cancel-in-progress: false

jobs:
  revendor:
    runs-on: ubuntu-latest  # Linux tar handles CE's symlinked mirror dirs that Windows tar.exe cannot.
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5

      - name: Re-vendor + apply/verify overlays
        shell: pwsh
        # -NoCommit: vendor + apply-overlays + verify-overlays, leave changes in the working
        # tree. verify-overlays.ps1 exits non-zero on overlay drift, failing the job here so a
        # broken overlay never reaches main.
        env:
          GH_TOKEN: ${{ github.token }}  # setup-fornida-plugins.ps1 uses `gh api` to resolve SHAs/tarballs.
        run: ./setup-fornida-plugins.ps1 -NoCommit

      - name: Validate manifests
        shell: bash
        # Hard gate: a malformed OR schema-invalid manifest must not reach main. The `claude`
        # CLI is not on GitHub runners, so replicate the checks that matter with jq:
        #   1. JSON well-formedness (jq empty) across marketplace + every plugin.json.
        #   2. `agents`, when present, must be an ARRAY of paths — a directory string
        #      (e.g. "./agents/") is what the Claude validator rejects with
        #      `agents: Invalid input`, which breaks the org sync so Required plugins
        #      (incl. caveman) stop distributing. This is the exact break superclaude caused.
        # Plus the claude.ai-HOSTED validator rules (stricter than local `claude plugin
        # validate`) that also break the org sync:
        #   3. No nested plugin.json below a plugin root (CE tests/fixtures).
        #   4. No top-level bin/ in any plugin (caveman ships one; hosted rejects bin/).
        #   5. No duplicate skill dir (vercel skills/<n>/upstream shadowing skills/<n>).
        run: |
          set -e
          jq empty .claude-plugin/marketplace.json
          while IFS= read -r f; do
            echo "validating $f"
            jq empty "$f"
            atype=$(jq -r 'if has("agents") then (.agents | type) else "array" end' "$f")
            if [ "$atype" != "array" ]; then
              echo "ERROR: $f has \"agents\" as $atype; the plugin validator requires an array of paths." >&2
              exit 1
            fi
          done < <(find plugins -maxdepth 3 -path '*/.claude-plugin/plugin.json')

          # 3. nested plugin.json (real ones live at depth 3: plugins/<name>/.claude-plugin/plugin.json)
          nested=$(find plugins -mindepth 4 -path '*/.claude-plugin/plugin.json' || true)
          if [ -n "$nested" ]; then
            echo "ERROR: nested plugin.json below plugin root (hosted validator rejects):" >&2
            echo "$nested" >&2; exit 1
          fi
          # 4. top-level bin/ per plugin
          bins=$(find plugins -mindepth 2 -maxdepth 2 -type d -name bin || true)
          if [ -n "$bins" ]; then
            echo "ERROR: top-level bin/ not allowed in hosted plugins:" >&2
            echo "$bins" >&2; exit 1
          fi
          # 5. duplicate skill dir shadow (e.g. skills/<n>/upstream)
          dups=$(find plugins -type d -path '*/skills/*/upstream' || true)
          if [ -n "$dups" ]; then
            echo "ERROR: nested duplicate skill dir (hosted validator rejects duplicate skill name):" >&2
            echo "$dups" >&2; exit 1
          fi

      - name: Commit + push to main on change
        shell: bash
        # If nothing changed, exit clean (no commit, no push). Otherwise commit the vendored
        # trees + VENDOR.md and push straight to main.
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No upstream changes — nothing to publish."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(vendor): scheduled re-pin of plugins to latest upstream; overlays re-applied"
          git push origin HEAD:main
