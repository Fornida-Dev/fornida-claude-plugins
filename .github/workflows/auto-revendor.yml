name: auto-revendor

# Keeps vendored plugins current with upstream without anyone remembering to run the
# vendor script. Weekly (and on-demand) it re-vendors from pinned upstream SHAs, re-applies
# + verifies the Fornida overlays, and opens/updates ONE rolling PR when something changed.
# It never pushes to main — merge is the human-gated publish to the org marketplace.
# See docs/plans/2026-06-26-001-feat-fix-and-merge-plugin-updates-plan.md (U3) and
# docs/brainstorms/2026-06-26-auto-revendor-plugins-requirements.md.
#
# PREREQUISITE (one-time, manual): Settings -> Actions -> General -> Workflow permissions ->
# enable "Allow GitHub Actions to create and approve pull requests". Without it the PR step
# fails with a 403.

on:
  schedule:
    # Mondays 13:00 UTC (~7-8am US Central). Runner clock is UTC.
    - cron: '0 13 * * 1'
  workflow_dispatch: {}

# Least privilege: push the rolling PR branch + open the PR. No broader main access.
permissions:
  contents: write
  pull-requests: write

# Never let two re-vendor runs race on the same branch.
concurrency:
  group: auto-revendor
  cancel-in-progress: false

jobs:
  revendor:
    runs-on: ubuntu-latest  # Linux tar handles CE's symlinked mirror dirs that Windows tar.exe cannot.
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Re-vendor + apply/verify overlays
        shell: pwsh
        # -NoCommit: vendor + apply-overlays + verify-overlays, leave changes in the working
        # tree for the PR step. verify-overlays.ps1 exits non-zero on overlay drift, which
        # fails the job here (set -e behaviour via $ErrorActionPreference in the script) so a
        # broken overlay blocks the PR loudly instead of shipping a verbose-revert.
        env:
          GH_TOKEN: ${{ github.token }}  # setup-fornida-plugins.ps1 uses `gh api` to resolve SHAs/tarballs.
        run: ./setup-fornida-plugins.ps1 -NoCommit

      - name: Open or update rolling PR
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676  # v7
        with:
          branch: automation/revendor
          delete-branch: true
          commit-message: "chore(vendor): re-pin plugins to latest upstream; overlays re-applied"
          title: "chore(vendor): scheduled re-pin of plugins to latest upstream"
          body: |
            Automated weekly re-vendor. Each updated plugin is re-pinned to its latest upstream
            SHA; Fornida overlays were re-applied and verified (`verify-overlays.ps1` passed).

            Review the provenance changes in `VENDOR.md` against the diff, then merge to publish
            to the org marketplace. No diff means this PR will not be opened.

            Generated by `.github/workflows/auto-revendor.yml`.
          labels: vendored-update
