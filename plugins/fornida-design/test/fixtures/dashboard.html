<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Dashboard</title><style>
*{box-sizing:border-box;margin:0}body{font:14px/1.5 sans-serif;color:oklch(0.21 0.006 285.885);background:oklch(1 0 0)}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
header{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid oklch(0.92 0.004 286.32)}
header .push{margin-left:auto}
button{font:inherit;padding:4px 12px;border:1px solid oklch(0.92 0.004 286.32);border-radius:6px;background:#fff}
button:focus-visible{outline:2px solid oklch(0.55 0.2 260);outline-offset:2px}
main{padding:16px;display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.card{border:1px solid oklch(0.92 0.004 286.32);border-radius:8px;padding:16px}
.card h2{font-size:16px;margin:0 0 8px}
.avatars{display:flex}.avatars span{width:32px;height:32px;border-radius:9999px;background:#ddd;border:2px solid #fff}
.avatars span+span{margin-left:-8px}
</style></head><body>
<header><strong>Acme</strong><button>Filter</button><button>Export</button><button class="push">Account<span class="sr-only">open account menu</span></button></header>
<main>
<div class="card"><h2>Revenue</h2><p>Monthly recurring revenue across all plans.</p><div class="avatars"><span></span><span></span><span></span></div></div>
<div class="card"><h2>Tickets</h2><p>Open tickets this week, grouped by priority.</p></div>
<div class="card"><h2>Uptime</h2><p>Rolling thirty day availability for all monitored hosts.</p></div>
</main></body></html>
