<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Menu</title><style>body{font:16px sans-serif;margin:0;padding:24px}#menu{display:none;margin-top:8px;border:1px solid #ccc;padding:12px}#menu.open{display:block}#menu a{display:block;padding:4px 12px}</style></head><body><main><h1>Menu</h1><button id="open">Open menu</button><div id="menu"><a href="#a">First item</a><a href="#b">Second item</a></div></main>
<script>document.getElementById('open').onclick=()=>document.getElementById('menu').classList.add('open')</script></body></html>
